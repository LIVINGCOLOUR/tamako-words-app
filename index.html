<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>たまこさんのえいご</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <main class="app">
    <div class="dec a">A</div>
    <div class="dec b">B</div>
    <div class="dec s1">★</div>
    <div class="dec s2">★</div>
    <section id="startScreen" class="screen active">
      <img class="logo" src="./assets/logo/cup_logo_clean.png" alt="たまこさん">
      <div class="title"><div class="main"><span class="c1">た</span><span class="c2">ま</span><span class="c3">こ</span><span class="c4">さん</span></div><span class="sub">のえいご</span></div>
      <div id="levelStatus" class="status"></div>
      <div id="levelSub" class="substatus"></div>
      <div class="learnLabel">おぼえた</div>
      <div class="progressWrap"><div id="progressBar" class="progressBar"></div></div>
      <div id="progressPercent" class="percent"></div>
      <div id="loadStatus" class="loading">よみこみちゅう</div>
      <button id="startBtn" class="btn mainbtn" disabled>▶ はじめる</button>
      <div class="grid2"><button id="toggleCatBtn" class="btn green small" disabled>📖 れんしゅうを<br>きめる</button><button id="reviewBtn" class="btn yellow small hide" disabled>🔁 ふくしゅう</button></div>
      <div class="grid2" style="margin-top:10px"><button id="scoreBtn" class="btn blue small" disabled>🏆 せいせき</button><button id="stickerBtn" class="btn pink small" disabled>🖼️ シール</button></div>
      <button id="settingsBtn" class="btn settingMini" disabled>⚙️ せってい</button>
      <div id="catStatus" class="status"></div>
      <div id="catPanel" class="panel hide"><div class="label">れんしゅう</div><div id="catBtns" class="grid2"></div><button id="randomBtn" class="btn yellow small" style="margin-top:10px">ぜんぶにもどす</button></div>
    </section>
    <section id="gameScreen" class="screen"><div class="qh"><div id="qCount" class="pill"></div><div id="timer" class="timer">10</div><div id="currentLevel" class="pill"></div></div><div id="wordCard" class="wordcard"><div id="kanaText" class="kana"></div><div id="wordText" class="word"></div><button id="listenBtn" class="btn listen">🔊 もういちど</button></div><div id="choices" class="choices"></div><button id="quitBtn" class="btn quit">やめる</button></section>
    <section id="resultScreen" class="screen"><div class="result"><div class="label">おしまい</div><div id="levelUpMsg" class="status" style="font-size:30px"></div><div id="finalScore" class="scorebig"></div><div id="resultMsg" class="status">シールをもらったよ</div><div id="earnedStickerWrap" class="stickerResultWrap"><img id="earnedSticker" class="stickerResult" alt="もらったシール"></div><div id="stickerMsg" class="status" style="font-size:30px"></div></div><button id="againBtn" class="btn mainbtn">もういちど</button><button id="homeBtn" class="btn green">はじめにもどる</button></section>
    <section id="scoreScreen" class="screen"><div class="title" style="margin-top:30px"><div class="main">せいせき</div></div><div id="levelTabs" class="levelTabs"></div><div id="scoreList" class="list"></div><button id="scoreHomeBtn" class="btn green">もどる</button></section>
    <section id="stickerScreen" class="screen"><div class="title" style="margin-top:30px"><div class="main">シール</div></div><div class="result"><div id="stickerCount" class="scorebig hide"></div><div id="stickerGrid" class="sticker-grid"></div></div><button id="stickerHomeBtn" class="btn green">もどる</button></section>
    <section id="settingsScreen" class="screen"><div class="title" style="margin-top:20px"><div class="main">せってい</div></div><div class="panel"><div class="settingBlock"><div class="settingTitle yellow">はつおん</div><div id="pronunciationOptions" class="settingOptions"></div></div><div class="settingBlock"><div class="settingTitle blue">じかん</div><div id="timeOptions" class="settingOptions"></div></div><div class="settingBlock"><div class="settingTitle pink">もんだい</div><div id="questionOptions" class="settingOptions"></div></div><div class="settingBlock supportStampSettings"><div class="settingTitle green">おうえんスタンプ</div><div class="supportNote">しゃしんはこのスマホの中だけに保存されます</div><div id="supportStampPreview" class="supportPreview"></div><input id="supportPhotoInput" class="fileInput" type="file" accept="image/*"><div class="supportActions"><label for="supportPhotoInput" class="btn blue supportChooseLabel">しゃしんをえらぶ</label><button id="supportDeleteBtn" class="btn pink supportDeleteBtn" type="button">けす</button></div><div id="supportStampStatus" class="supportStatus" role="status"></div></div><div id="supportVoiceMount" class="settingBlock supportVoiceSettings"></div></div><button id="settingsHomeBtn" class="btn green">もどる</button></section>
  </main>
  <div id="feedback" class="feedback"><div id="fbWordImage" class="fbWordImage hide"></div><div id="fbCircle" class="circle"></div><div id="fbEmoji" class="bigemoji"></div><div id="fbText" class="fbtext"></div><div id="fbAnswer" class="fbans"></div><div id="fbAnswerSmall" class="fbsmall"></div></div>
  <script src="./src/data/words_en.js"></script>
  <script src="./src/settings.js"></script>
  <script src="./src/state.js"></script>
  <script src="./src/quiz.js"></script>
  <script src="./src/audio.js"></script>
  <script src="./src/supportStamps.js"></script>
  <script src="./src/supportVoice.js"></script>
  <script src="./src/stickers.js"></script>
  <script src="./src/app.js"></script>
</body>
</html>
